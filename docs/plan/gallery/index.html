<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참여자 기획서 갤러리 · 유튜브 챌린지</title>
<meta name="description" content="유튜브 챌린지 참여자들의 채널 한 장 기획서 갤러리 (참여자 전용)">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root {
    --paper: #ffffff;
    --paper-warm: #f6f5f4;
    --ink: #31302e;
    --ink-soft: #615d59;
    --ink-faint: #a39e98;
    --line: #dddddd;
    --accent: #2563EB;
    --accent-dark: #1D4ED8;
    --accent-light: #60A5FA;
    --accent-bg: #eff4fe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    width: 100%; max-width: 800px; margin: 0 auto;
  }
  .doc { padding: 34px 52px 40px; }

  .topnav {
    display: flex; gap: 8px; align-items: center;
    border-bottom: 1.5px solid var(--line); margin-bottom: 30px;
   flex-wrap: wrap; align-items: center;}
  .topnav a {
    font-size: 14.5px; font-weight: 700; text-decoration: none;
    color: var(--ink-faint); padding: 12px 4px; margin-bottom: -1.5px;
    border-bottom: 2.5px solid transparent;
   white-space: nowrap;}
  .topnav a + a { margin-left: 18px; }
  .topnav a:hover { color: var(--ink-soft); }
  .topnav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  .eyebrow {
    display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--accent); border: 1.5px solid var(--accent-light);
    border-radius: 999px; padding: 5px 16px; margin-bottom: 20px;
  }
  h1 { font-size: 34px; font-weight: 800; line-height: 1.24; letter-spacing: -0.02em; margin-bottom: 14px; }
  h1 .hl { color: var(--accent); }
  .lede { font-size: 16px; color: var(--ink-soft); max-width: 40em; margin-bottom: 26px; }

  .status { text-align: center; color: var(--ink-faint); font-size: 14.5px; padding: 60px 0; }

  .card {
    border: 1.5px solid var(--line); border-radius: 16px;
    padding: 24px 26px; margin-bottom: 22px; background: var(--paper);
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-head .pname { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .card-head .pchannel { font-size: 14px; font-weight: 700; color: var(--accent-dark); }
  .card .concept { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .item { margin-top: 12px; }
  .item .q { font-size: 12.5px; font-weight: 800; color: var(--accent); letter-spacing: 0.02em; margin-bottom: 2px; }
  .item .a { font-size: 14.5px; color: var(--ink); white-space: pre-wrap; }
  .item .a.empty { color: var(--ink-faint); }
  .meta { font-size: 12px; color: var(--ink-faint); margin-top: 14px; text-align: right; }

  .posmap { margin-top: 18px; border-top: 1.5px dashed var(--line); padding-top: 16px; }
  .posmap-head { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: 0.01em; }
  .posmap-head .sub { font-weight: 400; font-size: 11.5px; color: var(--ink-faint); margin-left: 8px; }
  .posmap-axes { font-size: 12px; color: var(--ink-soft); margin: 6px 0 10px; line-height: 1.5; }
  .posmap-axes b { color: var(--accent-dark); }
  .posmap svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .posmap-reco { font-size: 13px; color: var(--accent-dark); background: var(--accent-bg); border-radius: 10px; padding: 10px 13px; margin-top: 10px; line-height: 1.55; }
  .posmap details { margin-top: 10px; }
  .posmap summary { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .posmap summary:hover { color: var(--accent); }
  .zone { font-size: 12.5px; color: var(--ink-soft); background: var(--paper-warm); border-radius: 10px; padding: 9px 12px; margin-top: 8px; line-height: 1.55; }
  .zone b { color: var(--ink); }
  .postbl-wrap { overflow-x: auto; margin-top: 8px; }
  .postbl { border-collapse: collapse; width: 100%; font-size: 12px; }
  .postbl th, .postbl td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .postbl th { background: var(--paper-warm); white-space: nowrap; }
  .postbl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1.5px solid var(--line);
    font-size: 12.5px; color: var(--ink-faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  @media (max-width: 640px) {
    .doc { padding: 24px 20px 30px; }
    h1 { font-size: 26px; }
    .card { padding: 18px 18px; }
  }
</style>
</head>
<body>
<div class="doc">

  <nav class="topnav">
    <a href="../../">제안서</a>
    <a href="../" class="active">채널 기획서</a>
    <a href="../../submit/">영상 기획안</a>
    <a href="../../verify/">영상 인증</a>
    <a href="../../ot/">OT 자료</a>
  </nav>

  <div class="eyebrow">PARTICIPANTS ONLY · GALLERY</div>
  <h1>참여자 기획서 갤러리<br><span class="hl">서로의 뼈대를 봅니다.</span></h1>
  <p class="lede">챌린지 참여자들이 제출한 채널 한 장 기획서입니다. 7월 25일(토) 오전 10시 온라인 OT에서 각자 발표해요. 이 페이지는 참여자 전용 링크로만 열립니다.</p>

  <div class="status" id="status">기획서를 불러오는 중…</div>
  <div id="list"></div>

  <footer>
    <span>YouTube Challenge · Plan Gallery</span>
    <span>© 2026 BuildnWrite. All rights reserved.</span>
  </footer>

</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwKhHRacGbizn9nDf4go0yWjuj4tfiNGNAbXnbPMRRZIUATeRY91tyWPyhcQ5KBdpGs/exec';
  const ITEMS = [
    ['reason', '① 유튜브를 하는 이유'],
    ['pipeline', '② 사업 파이프라인'],
    ['audience', '③ 주 목적 시청층'],
    ['cta', '④ 유입 첫 단계 (CTA · 랜딩)'],
    ['message', '⑤ 채널이 전달하려는 메시지']
  ];
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');

  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function card(p){
    const items = ITEMS.map(([key, label]) => {
      const v = (p[key] || '').trim();
      return `<div class="item"><div class="q">${label}</div><div class="a${v ? '' : ' empty'}">${v ? esc(v) : '(미작성)'}</div></div>`;
    }).join('');
    const updated = p.updated_at ? new Date(p.updated_at) : null;
    const meta = updated ? `마지막 수정 ${updated.getMonth()+1}/${updated.getDate()}` + (Number(p.submit_count) > 1 ? ` · ${p.submit_count}번째 제출` : '') : '';
    return `<div class="card">
      <div class="card-head"><span class="pname">${esc(p.name)}</span>${p.channel_name ? `<span class="pchannel">${esc(p.channel_name)}</span>` : ''}</div>
      ${p.concept ? `<div class="concept">${esc(p.concept)}</div>` : ''}
      ${items}
      ${meta ? `<div class="meta">${meta}</div>` : ''}
    </div>`;
  }

  function render(plans){
    if(!plans.length){
      statusEl.textContent = '아직 제출된 기획서가 없어요, 첫 번째 주인공이 되어보세요.';
      return false;
    }
    statusEl.style.display = 'none';
    listEl.innerHTML = plans.map(card).join('');
    attachMaps(plans);
    return true;
  }

  // ── 유사채널 포지셔닝 맵 (참가자 이름 해시로 정적 JSON 매칭 — 리포에 이름 비노출) ──
  const posCache = new Map();
  async function nameHash(name){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0,12);
  }
  async function attachMaps(plans){
    if(!window.crypto || !crypto.subtle) return;
    const cards = listEl.children;
    plans.forEach(async (p, i) => {
      const cardEl = cards[i];
      if(!cardEl || !p.name) return;
      try {
        const h = await nameHash(p.name.trim());
        if(!posCache.has(h)){
          posCache.set(h, fetch(`positioning/${h}.json`).then(r => r.ok ? r.json() : null).catch(() => null));
        }
        const data = await posCache.get(h);
        if(data && cardEl.parentNode === listEl && !cardEl.querySelector('.posmap')) renderMap(cardEl, data);
      } catch(e) {}
    });
  }
  function svgEl(t, a){ const e = document.createElementNS('http://www.w3.org/2000/svg', t); for(const k in a) e.setAttribute(k, a[k]); return e; }
  function svgTxt(x, y, s, a={}){ const e = svgEl('text', {x, y, 'font-family':'inherit', ...a}); e.textContent = s; return e; }
  function renderMap(cardEl, data){
    const meta = data.meta || {};
    const syn = data.synthesis || {};
    const wrap = document.createElement('div');
    wrap.className = 'posmap';
    wrap.innerHTML = `<div class="posmap-head">유사채널 포지셔닝 맵<span class="sub">${esc(meta.date || '')} · 멀티에이전트 웹서치 · ${data.channels.length}개 채널</span></div>
      <div class="posmap-axes"><b>X축</b> ${esc(meta.x_axis || '')}<br><b>Y축</b> ${esc(meta.y_axis || '')}</div>`;

    const W = 720, H = 470, M = {l:42, r:20, t:16, b:44};
    const px = x => M.l + (x/100)*(W-M.l-M.r);
    const py = y => H-M.b - (y/100)*(H-M.t-M.b);
    const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':'포지셔닝 산점도'});
    for(let v=0; v<=100; v+=25){
      svg.append(svgEl('line',{x1:px(v),y1:py(0),x2:px(v),y2:py(100),stroke:'#eeecea','stroke-width':1}));
      svg.append(svgEl('line',{x1:px(0),y1:py(v),x2:px(100),y2:py(v),stroke:'#eeecea','stroke-width':1}));
      svg.append(svgTxt(px(v),H-M.b+16,v,{'text-anchor':'middle','font-size':10,fill:'#a39e98'}));
      svg.append(svgTxt(M.l-8,py(v)+3,v,{'text-anchor':'end','font-size':10,fill:'#a39e98'}));
    }
    (syn.empty_zones||[]).forEach((z,i)=>{
      svg.append(svgEl('ellipse',{cx:px(z.x_center),cy:py(z.y_center),rx:62,ry:40,fill:'#2563EB',opacity:0.06}));
      svg.append(svgEl('ellipse',{cx:px(z.x_center),cy:py(z.y_center),rx:62,ry:40,fill:'none',stroke:'#2563EB','stroke-dasharray':'5 4','stroke-width':1.4}));
      svg.append(svgTxt(px(z.x_center),py(z.y_center)-46,'기회의 땅 '+(i+1),{'text-anchor':'middle','font-size':10.5,fill:'#1D4ED8','font-weight':700}));
    });
    svg.append(svgTxt((M.l+W-M.r)/2,H-8,meta.x_label||'X →',{'text-anchor':'middle','font-size':11,fill:'#615d59','font-weight':600}));
    const yl = svgTxt(0,0,meta.y_label||'Y →',{'text-anchor':'middle','font-size':11,fill:'#615d59','font-weight':600});
    yl.setAttribute('transform',`translate(12,${(H-M.b+M.t)/2}) rotate(-90)`); svg.append(yl);

    const labeled = new Set(
      [...data.channels].sort((a,b)=>(b.subs||b.subscribers_num||0)-(a.subs||a.subscribers_num||0)).slice(0,8).map(c=>c.name)
    );
    const rOf = s => s ? Math.max(4, Math.min(14, Math.sqrt(s)/70)) : 3.5;
    data.channels.forEach(c=>{
      const subs = c.subs ?? c.subscribers_num;
      const subsText = c.subs_text ?? c.subscribers_text;
      const r = rOf(subs), known = !!subs;
      const dot = svgEl('circle',{cx:px(c.x),cy:py(c.y),r,fill:known?'#0e9888':'none',stroke:known?'#fff':'#0e9888','stroke-width':known?1.6:1.6,opacity:0.92});
      const tip = svgEl('title',{});
      tip.textContent = `${c.name} (${c.x}, ${c.y}) · ${subsText||'구독자 미확인'}\n${c.topic||''}`;
      dot.append(tip);
      svg.append(dot);
      if(labeled.has(c.name)){
        svg.append(svgTxt(px(c.x)+r+3,py(c.y)+3.5,c.name,{'font-size':10,fill:'#31302e','font-weight':600,'paint-order':'stroke',stroke:'#ffffffcc','stroke-width':3}));
      }
    });
    const reco = meta.recommended;
    if(reco){
      const rx = px(reco.x), ry = py(reco.y);
      let path = '';
      for(let i=0;i<10;i++){ const a = Math.PI/5*i - Math.PI/2, rr = i%2 ? 5 : 11; path += (i?'L':'M')+(rx+rr*Math.cos(a)).toFixed(1)+','+(ry+rr*Math.sin(a)).toFixed(1); }
      svg.append(svgEl('path',{d:path+'Z',fill:'#1D4ED8',stroke:'#fff','stroke-width':1.3}));
      svg.append(svgTxt(rx+14,ry+4,`${reco.label||'권장 포지션'} (${reco.x}, ${reco.y})`,{'font-size':11,fill:'#1D4ED8','font-weight':800,'paint-order':'stroke',stroke:'#ffffffdd','stroke-width':3}));
    }
    wrap.append(svg);

    if(syn.recommendation){
      const rc = document.createElement('div');
      rc.className = 'posmap-reco';
      rc.innerHTML = `<b>★ ${esc((reco && reco.label) || '권장 포지션')}</b> — ${esc(syn.recommendation)}`;
      wrap.append(rc);
    }
    const det = document.createElement('details');
    const zones = (syn.empty_zones||[]).map((z,i)=>
      `<div class="zone"><b>기회의 땅 ${i+1} — ${esc(z.label)} (${z.x_center}, ${z.y_center})</b><br>왜 비었나: ${esc(z.why_empty)}<br>기회: ${esc(z.opportunity)}<br>리스크: ${esc(z.risk)}</div>`).join('');
    const rows = [...data.channels].sort((a,b)=>((b.subs??b.subscribers_num)||0)-((a.subs??a.subscribers_num)||0)).map(c=>{
      const subs = c.subs ?? c.subscribers_num;
      return `<tr><td><b>${esc(c.name)}</b></td><td class="num">${c.x}</td><td class="num">${c.y}</td><td class="num">${subs?subs.toLocaleString():'—'}</td><td>${esc(c.topic||'')}</td></tr>`;
    }).join('');
    det.innerHTML = `<summary>기회의 땅 상세 + 레퍼런스 채널 리스트 (${data.channels.length})</summary>${zones}
      <div class="postbl-wrap"><table class="postbl"><thead><tr><th>채널</th><th>X</th><th>Y</th><th>구독자</th><th>주력 주제</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;">구독자 수는 검색으로 확인된 값만 표기(미확인은 —, 지도에서 테두리만 있는 작은 점). 점 크기 = 구독자 규모.</div>`;
    wrap.append(det);
    cardEl.append(wrap);
  }

  async function load(){
    const token = new URLSearchParams(location.search).get('t');
    if(!token){
      statusEl.textContent = '이 페이지는 참여자 전용입니다. 기획서 제출 후 받은 이메일의 링크로 들어와주세요.';
      return;
    }
    const CACHE_KEY = 'plan-gallery:' + token;
    // 캐시가 있으면 즉시 렌더 (체감 0초), 이어서 백그라운드에서 최신본으로 교체
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e) {}
    if(cached && cached.plans) render(cached.plans);
    else statusEl.textContent = '기획서를 불러오는 중입니다…';
    try {
      const res = await fetch(`${API_URL}?action=gallery&t=${encodeURIComponent(token)}`);
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'invalid');
      localStorage.setItem(CACHE_KEY, JSON.stringify({plans: data.plans, at: Date.now()}));
      render(data.plans);
    } catch(e) {
      if(!cached) statusEl.textContent = '기획서를 불러오지 못했어요. 이메일의 링크가 맞는지 확인해주세요.';
    }
  }
  load();
</script>
</body>
</html>
